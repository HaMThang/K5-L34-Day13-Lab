# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Gate 2a chỉ duyệt kế hoạch pilot này, chưa duyệt chạy chính thức.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02). Số do src/lab13.py in ra
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (mức chênh 5 điểm)
#   b) Theo nhân viên, m = 75: hệ số thiết kế 2,48; 3.103 yêu cầu mỗi nhóm, tức 42 nhân viên mỗi nhóm, tổng 84 người, lớn hơn 40 nhân viên hiện có: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000, nhỏ hơn 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300: không đạt, và chỉ có 6 cụm, dưới 20
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: mỗi nhân viên cần ít nhất m = 299 yêu cầu, hệ số thiết kế 6,96
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20)
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng các depot với nhóm trợ lý
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên bằng code, seed ghi trước ngày bắt đầu, phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: có nguy cơ nhân viên cùng depot chia sẻ câu trả lời của trợ lý; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm
#
# Đánh đổi đã chấp nhận: không cách chia nào đủ mẫu cho mức chênh 5 điểm với 40 nhân viên. Nhóm chọn mức chênh 6 điểm (n = 859 mỗi nhóm, m = 299 yêu cầu mỗi nhân viên). Nếu tác động thật chỉ là 5 điểm thì power chỉ còn khoảng 0,64 thay vì 0,80. Giám đốc vận hành phải ký chấp nhận đánh đổi này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97%. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng ngưỡng so với đối chứng (chênh 2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang tại các depot của nhân viên tham gia. Lý do bằng số (simulated): noi_dia 0,22× và hang_nang 0,69× so với 12.000 đ. Loại quoc_te (1,88×, chỉ 27,3% thành công, chạy lại không giúp) và doi_tac (0,85×, có điều khoản riêng)"
  assignment:
    unit: "staff"                   # 20 nhân viên dùng trợ lý, 20 nhân viên đối chứng
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; tương ứng 4, 10, 20 nhân viên mỗi nhóm; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, theo luồng nhân viên tự làm"
    spillover_risk: "Chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trước ngày bắt đầu; seed ngẫu nhiên ghi trước"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên, hoặc vượt 6% tuyệt đối, hoặc có ít nhất 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (simulated, thay bằng phút đo thật từ tuần 1) vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa hoặc bỏ) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày để tìm nguyên nhân KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút trong mẫu)"
    - "phut_lam_lai_simulated (1.132 phút trong mẫu)"
    - "chi phí mỗi việc thành công 4.472 đ, ngưỡng chi phí 8.000 đ"
    - "so sánh 0,22× và 0,69× với 12.000 đ nhân viên tự làm"
